[build-system]
requires = ["setuptools", "setuptools_scm", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["tests*", "test*"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "dirty-tag"
write_to = "gspeech/version.py"

[project]
name = "g-speech"
description = "Interruptible text-to-speech using the Google Translate TTS API."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Karim Aziiev", email = "karim.aziiev@gmail.com" }
]
dependencies = [
  "miniaudio>=1.61",
  "platformdirs>=4.3",
  "requests>=2.31"
]

keywords = ["speech", "audio", "synthesis", "voice", "google", "tts"]
dynamic = ["version"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/KarimAziev/gspeech"
Issues = "https://github.com/KarimAziev/gspeech/issues"
Repository = "https://github.com/KarimAziev/gspeech"

[project.scripts]
gspeech = "gspeech.cli:main"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["gspeech/version.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "LOG", "UP"]
ignore = ["E501", "E731", "E402"]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.10",
  "pre-commit",
  "pyright",
  "ruff",
]

[tool.coverage.run]
branch = true
source = ["gspeech"]
omit = ["gspeech/version.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.setuptools.package-data]
gspeech = ["py.typed"]
